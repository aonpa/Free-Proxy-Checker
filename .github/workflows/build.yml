name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: FreeProxyChecker-Windows
          - os: ubuntu-latest
            asset_name: FreeProxyChecker-Linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: pyinstaller --noconfirm --onefile --windowed --name FreeProxyChecker-Windows main.py

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pyinstaller --noconfirm --onefile --name FreeProxyChecker-Linux main.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/FreeProxyChecker-Windows.exe
            dist/FreeProxyChecker-Linux
